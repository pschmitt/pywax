name: Lint

on: [push, pull_request]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pschmitt/ci-workflows/.github/actions/python-ruff@main
        with:
          python-version: '3.x'
          upgrade-pip: 'false'
          check-path: .
          format-check: 'true'
